name: Run checks
on:
    pull_request:
    push:
        branches:
            - trunk
jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              uses: php-actions/composer@v6
              with:
                  args: --ignore-platform-reqs

            - name: Install Dependencies
              run: npm i

            - name: Run PHP Lint
              run: npm run lint:php

            - name: Run JS Lint
              if: success() || failure()
              run: npm run lint:js

            - name: Run CSS Lint
              if: success() || failure()
              run: npm run lint:css

            - name: Run Markdown Lint
              if: success() || failure()
              run: npm run lint:md-docs

            - name: Run package.json Lint
              if: success() || failure()
              run: npm run lint:pkg-json

    tests:
        name: Test Suite
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install Composer
              uses: php-actions/composer@v6
              with:
                  args: --ignore-platform-reqs

            - name: Install Node Dependencies
              run: npm i

            - name: Compile JavaScript App
              run: npm run build

            - name: Setup MySQL
              if: success() || failure()
              uses: shogo82148/actions-setup-mysql@v1
              with:
                  mysql-version: '8.0'

            - name: Run JavaScript unit tests
              run: npm run test:unit

            - name: Install Subversion
              run: sudo apt-get update -y && sudo apt-get install -y subversion

            - name: Run PHP tests
              run: |
                  mysql -uroot -h127.0.0.1 -e 'SELECT version()' \
                  && ./bin/install-wp-tests.sh --wp-version=trunk --recreate-db wordpress_test root ''  > /dev/null \
                  && composer run-script test

    e2e:
        name: E2E Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install Node Dependencies
              run: npm i

            - name: Build JavaScript
              run: npm run build

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Start wp-env
              run: npm run test:php:setup

            - name: Run E2E tests
              run: npm run test:e2e

            - name: Upload test artifacts on failure
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-artifacts
                  path: artifacts/
                  if-no-files-found: ignore
